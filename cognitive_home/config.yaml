name: "Cognitive Home"
description: "Learns your routine and suggests smart automations"
version: "1.0.0"
slug: "cognitive_home"
init: false
arch:
  - aarch64
  - amd64
startup: services
homeassistant_api: true
hassio_api: true
hassio_role: default
options:
  ollama_url: "http://ollama:11434/api/chat"
  ollama_model: "SmolLM2:360M"
  check_interval_minutes: 1
  min_occurrences: 1
  confidence_threshold: 0.2
  lookahead_minutes: 60
  force_suggestion_mode: true
  disable_weekday_check: true
  reset_on_startup: false
schema:
  ollama_url: str
  ollama_model: str
  check_interval_minutes: int
  min_occurrences: int
  confidence_threshold: float
  lookahead_minutes: int
  force_suggestion_mode: bool
  disable_weekday_check: bool
  reset_on_startup: bool
map:
  - data:rw
ports:
  8099/tcp: 8099